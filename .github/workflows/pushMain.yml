---
#---------------------------------------------------------
# - Create a semantical release
# - Merge main into alpha and beta
#---------------------------------------------------------
name: Push to main

on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  merge-main-to-dev-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Merge main into beta
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          source-branch: main
          target-branch: beta

  semantic-release:
    needs: merge-main-to-dev-branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        id: checkout
        with:
          persist-credentials: false

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ba330626c4750c19d8299de843f05c7aa5574f62 # v5.0.2
        id: semantic
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

      - name: Publish To GitHub Package Registry
        id: publish
        if: steps.semantic.outputs.new_release_published == 'true'
        run: echo "new release was published"
        shell: bash

      - name: Push updates to branch for major version
        id: push_major
        if: steps.semantic.outputs.new_release_published == 'true'
        run: 'git push https://x-access-token:${{ env.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git HEAD:refs/heads/v${{steps.semantic.outputs.new_release_major_version}}'
        shell: bash
